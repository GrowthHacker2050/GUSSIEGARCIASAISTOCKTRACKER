name: Update stock tracker

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # every 30 minutes while the US market is open (UTC)
    - cron: "15 23 * * *"          # once every evening for news and weekends
  workflow_dispatch: {}            # "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: planner
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build market data
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
